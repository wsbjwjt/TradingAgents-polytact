[project]
name = "tradingagents-engine"
version = "0.1.0"
description = "FastAPI service wrapping vendored TradingAgents-astock engine with TradingAgents-CN compatible HTTP API"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# 核心依赖：故意不依赖 astock，保证测试环境可单独安装
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["engine"]
