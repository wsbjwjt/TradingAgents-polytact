[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingagents-studio"
version = "0.1.0"
description = "TradingAgents-polytact Studio：对接 polytact engine 的飞书晨报与回放套件"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "studio contributors" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "croniter>=2.0",
    "markdown>=3.5",
    "lark-oapi>=1.4",
    # Windows 无系统时区库，cron 的 ZoneInfo("Asia/Shanghai") 需要它
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
studio = "studio.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]
